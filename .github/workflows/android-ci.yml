name: Android CI

on:
  pull_request:
    branches: [ main, develop, release/** ]
  push:
    branches: [ feature/**, bugfix/** ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: DevDebug
            flavorDir: dev
          - variant: ProdDebug
            flavorDir: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assemble${{ matrix.variant }} --stacktrace

      - name: Unit tests
        run: ./gradlew :app:test${{ matrix.variant }}UnitTest

      - name: Lint
        run: ./gradlew :app:lint${{ matrix.variant }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avalag-${{ github.ref_name }}-${{ matrix.flavorDir }}-debug
          path: app/build/outputs/apk/${{ matrix.flavorDir }}/debug/*.apk
          if-no-files-found: error