name: Android CI

on:
  pull_request:
    branches: [ main, develop, release/** ]
  push:
    branches: [ feature/**, bugfix/** ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: DevDebug
            flavorDir: dev
          - variant: ProdDebug
            flavorDir: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute safe artifact ref
        shell: bash
        run: |
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE_REF="${REF//\//-}"
          echo "SAFE_REF=$SAFE_REF" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app:assemble${{ matrix.variant }} --stacktrace

      - name: Unit tests
        run: ./gradlew :app:test${{ matrix.variant }}UnitTest

      - name: Lint
        run: ./gradlew :app:lint${{ matrix.variant }}

      # Optional debug step (remove later if you want)
      - name: List APK outputs
        run: ls -R app/build/outputs/apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avalag-${{ env.SAFE_REF }}-${{ matrix.flavorDir }}-debug
          path: app/build/outputs/apk/${{ matrix.flavorDir }}/debug/*.apk
          if-no-files-found: error